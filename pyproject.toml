[project]
name = "production-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "black>=26.5.1",
    "chromadb>=1.5.9",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-google>=0.1.1",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-mistralai>=1.1.6",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.2",
    "sentence-transformers>=5.7.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pyflakes, pycodestyle, isort, pyupgrade, bugbear
ignore = []

[tool.black]
line-length = 88
target-version = ["py311"]
